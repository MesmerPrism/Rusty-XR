[package]
name = "rusty-xr-contracts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Framework-neutral XR data contracts for Rusty XR."

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[[example]]
name = "plain_stereo_feedback_layout"
path = "examples/plain_stereo_feedback_layout.rs"
required-features = ["serde"]

[[example]]
name = "composite_feedback_session"
path = "examples/composite_feedback_session.rs"
required-features = ["serde"]

[[example]]
name = "meta_passthrough_style_catalog"
path = "examples/meta_passthrough_style_catalog.rs"
required-features = ["serde"]

[[example]]
name = "audio_reactive_passthrough_style"
path = "examples/audio_reactive_passthrough_style.rs"
required-features = ["serde"]

[[example]]
name = "visual_strobe_profiles"
path = "examples/visual_strobe_profiles.rs"
required-features = ["serde"]

[[example]]
name = "developer_home_manifest"
path = "examples/developer_home_manifest.rs"
required-features = ["serde"]

[[example]]
name = "kiosk_command_run_record"
path = "examples/kiosk_command_run_record.rs"
required-features = ["serde"]

[[example]]
name = "effect_stack_diagnostic_manifest"
path = "examples/effect_stack_diagnostic_manifest.rs"
required-features = ["serde"]

[[example]]
name = "projection_performance_matrix_packet"
path = "examples/projection_performance_matrix_packet.rs"
required-features = ["serde"]

[[example]]
name = "depth_world_space_contract"
path = "examples/depth_world_space_contract.rs"
required-features = ["serde"]

[lints]
workspace = true
