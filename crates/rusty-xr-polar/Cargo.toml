[package]
name = "rusty-xr-polar"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Polar H10 data contracts and protocol helpers for Rusty XR."

[features]
default = []
serde = ["dep:serde", "rusty-xr-ble/serde", "rusty-xr-lsl/serde"]

[dependencies]
rusty-xr-ble = { path = "../rusty-xr-ble" }
rusty-xr-lsl = { path = "../rusty-xr-lsl" }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
