[workspace]
resolver = "2"
members = [
    "crates/rusty-xr-contracts",
    "crates/rusty-xr-runtime-config",
    "crates/rusty-xr-ble",
    "crates/rusty-xr-debug-canvas",
    "crates/rusty-xr-lsl",
    "crates/rusty-xr-osc",
    "crates/rusty-xr-zmq",
    "crates/rusty-xr-broker-model",
    "crates/rusty-xr-eye-model",
    "crates/rusty-xr-polar",
    "crates/rusty-xr-quest-diagnostics",
    "crates/rusty-xr-camera-model",
    "crates/rusty-xr-depth-model",
    "crates/rusty-xr-sdf",
    "crates/rusty-xr-particles",
    "examples/quest-minimal-apk/native",
    "examples/quest-composite-layer-apk/native",
    "examples/quest-gl-openxr-video-stack-apk/native",
    "examples/broker-client-probe",
]
exclude = ["examples/makepad-camera-shell"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/MesmerPrism/Rusty-XR"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
