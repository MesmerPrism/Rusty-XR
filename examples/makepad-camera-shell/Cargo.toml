[package]
name = "rusty-quest-makepad-camera-shell"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Makepad-first Quest shell for comparing Rusty Morphospace camera workflow affordances."
repository = "https://github.com/MesmerPrism/Rusty-XR"
build = "build.rs"

[features]
default = []
makepad-hwb-ycbcr-metadata = []

[dependencies]
rusty-quest-makepad-xr = { package = "makepad-xr", git = "https://github.com/MesmerPrism/makepad.git", rev = "407caacaa8a1bd1070986ef3fe6eadebee602143", version = "1.0.0" }
rusty-xr-camera-model = { path = "../../crates/rusty-xr-camera-model" }
rusty-xr-contracts = { path = "../../crates/rusty-xr-contracts" }
rusty-quest-projection-runtime-config = { path = "../../crates/rusty-quest-projection-runtime-config" }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = "0.6"
