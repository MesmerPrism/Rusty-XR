[package]
name = "rusty-xr-makepad-q2q-camera-shell"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Makepad-first Quest shell for comparing Rusty XR Q2Q camera workflow affordances."
repository = "https://github.com/MesmerPrism/Rusty-XR"

[dependencies]
makepad-xr = { git = "https://github.com/MesmerPrism/makepad.git", branch = "rusty-xr/android-libstd-packaging", version = "1.0.0" }
rusty-xr-runtime-config = { path = "../../crates/rusty-xr-runtime-config" }

[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = "0.6"
